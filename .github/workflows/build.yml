name: Stuxnet iOS CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "stuxnet-v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stuxnet-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      STUXNET_BAZEL_CACHE: /Users/runner/.cache/stuxnet-bazel

    steps:
      - name: Check out sources
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode 26.2
        shell: bash
        run: |
          set -euo pipefail
          XCODE_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          XCODE_DEVELOPER_DIR="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

          if [[ ! -d "$XCODE_DEVELOPER_DIR" ]]; then
            echo "Required Xcode is unavailable: $XCODE_DEVELOPER_DIR" >&2
            echo "Installed Xcode applications:" >&2
            ls -1 /Applications/Xcode*.app >&2 || true
            exit 1
          fi

          sudo xcode-select --switch "$XCODE_DEVELOPER_DIR"
          xcodebuild -version

      - name: Restore Bazel compilation cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STUXNET_BAZEL_CACHE }}
          key: stuxnet-bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel', 'WORKSPACE', 'WORKSPACE.bzlmod', '.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            stuxnet-bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel', 'WORKSPACE', 'WORKSPACE.bzlmod', '.gitmodules') }}-

      - name: Validate Stuxnet build configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("build-system/stuxnet-configuration.json").read_text())
          required = {
              "bundle_id", "api_id", "api_hash", "team_id", "is_internal_build",
              "is_appstore_build", "app_specific_url_scheme"
          }
          missing = sorted(required.difference(config))
          if missing:
              raise SystemExit(f"Missing configuration keys: {', '.join(missing)}")
          if config["bundle_id"] == "ph.telegra.Telegraph":
              raise SystemExit("Stuxnet CI must not use Telegram's production bundle id")
          if "{" in config["api_id"] or "{" in config["api_hash"]:
              raise SystemExit("Replace Telegram API placeholders before building")

          versions = json.loads(Path("versions.json").read_text())
          if not versions.get("app") or not versions.get("xcode"):
              raise SystemExit("versions.json is missing app or Xcode version")
          PY

      - name: Run source and asset sanity checks
        shell: bash
        run: |
          set -euo pipefail

          git show --check --format= HEAD
          plutil -lint \
            Telegram/Telegram-iOS/Info.plist \
            Telegram/Telegram-iOS/InfoBazel.plist \
            "Telegram/WatchApp/tgwatch Watch App/Info.plist"

          python3 - <<'PY'
          import json
          from pathlib import Path

          required_sources = [
              Path("submodules/AccountContext/Sources/VoiceLabProcessor.swift"),
              Path("submodules/TelegramCore/Sources/Settings/StuxnetSettings.swift"),
              Path("submodules/SettingsUI/Sources/Stuxnet/StuxnetSettingsController.swift"),
          ]
          missing_sources = [str(path) for path in required_sources if not path.is_file()]
          if missing_sources:
              raise SystemExit("Missing Stuxnet sources: " + ", ".join(missing_sources))

          asset_dir = Path("Telegram/Telegram-iOS/DefaultAppIcon.xcassets/AppIconLLC.appiconset")
          contents = json.loads((asset_dir / "Contents.json").read_text())
          missing_assets = []
          for image in contents.get("images", []):
              filename = image.get("filename")
              if filename and not (asset_dir / filename).is_file():
                  missing_assets.append(filename)
          if missing_assets:
              raise SystemExit("Missing app icon assets: " + ", ".join(sorted(set(missing_assets))))
          PY

      - name: Compile and run Voice Lab smoke test
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -O \
            submodules/AccountContext/Sources/VoiceLabProcessor.swift \
            build-system/tests/VoiceLabProcessorSmoke/main.swift \
            -o /tmp/stuxnet-voice-lab-smoke
          /tmp/stuxnet-voice-lab-smoke

      - name: Create canonical source directory
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="/Users/Shared/telegram-ios"
          sudo install -d -o "$USER" -g staff "$SOURCE_DIR"
          ditto "$GITHUB_WORKSPACE" "$SOURCE_DIR"

      - name: Build unsigned Stuxnet IPA
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="/Users/Shared/telegram-ios"
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_stuxnet"
          CODESIGN_DIR="/private/var/tmp/stuxnet-fake-codesigning"
          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          APP_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          rm -rf "$CODESIGN_DIR"
          mkdir -p "$CODESIGN_DIR/certs" "$CODESIGN_DIR/profiles"
          cp build-system/fake-codesigning/certs/* "$CODESIGN_DIR/certs/"
          python3 build-system/Make/GenerateProfiles.py \
            --source build-system/fake-codesigning/profiles \
            --destination "$CODESIGN_DIR/profiles" \
            --certs "$CODESIGN_DIR/certs" \
            --source-bundle-id ph.telegra.Telegraph \
            --bundle-id com.der999a.stuxnet \
            --source-team-id C67CF9S4VU \
            --team-id C67CF9S4VU

          python3 build-system/Make/ImportCertificates.py \
            --path "$CODESIGN_DIR/certs"

          echo "Starting the full application build"
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$STUXNET_BAZEL_CACHE" \
            build \
            --configurationPath=build-system/stuxnet-configuration.json \
            --codesigningInformationPath="$CODESIGN_DIR" \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath=build/artifacts

          OUTPUT_PATH="build/artifacts"
          if [[ ! -f "$OUTPUT_PATH/Telegram.ipa" ]]; then
            echo "Telegram.ipa was not collected by the Telegram build system." >&2
            exit 1
          fi
          mv "$OUTPUT_PATH/Telegram.ipa" "$OUTPUT_PATH/Stuxnet.ipa"

          if [[ ! -f "$OUTPUT_PATH/Telegram.DSYMs.zip" ]]; then
            echo "Telegram.DSYMs.zip was not collected by the Telegram build system." >&2
            exit 1
          fi
          mv "$OUTPUT_PATH/Telegram.DSYMs.zip" "$OUTPUT_PATH/Stuxnet.DSYMs.zip"

          mkdir -p "$GITHUB_WORKSPACE/build/artifacts"
          cp "$OUTPUT_PATH/Stuxnet.ipa" "$GITHUB_WORKSPACE/build/artifacts/Stuxnet.ipa"
          cp "$OUTPUT_PATH/Stuxnet.DSYMs.zip" "$GITHUB_WORKSPACE/build/artifacts/Stuxnet.DSYMs.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: Stuxnet-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: |
            build/artifacts/Stuxnet.ipa
            build/artifacts/Stuxnet.DSYMs.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/stuxnet-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /Users/Shared/telegram-ios
          TAG="$GITHUB_REF_NAME"
          TITLE="Stuxnet ${APP_VERSION} (${BUILD_NUMBER})"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              build/artifacts/Stuxnet.ipa \
              build/artifacts/Stuxnet.DSYMs.zip \
              --clobber
          else
            gh release create "$TAG" \
              build/artifacts/Stuxnet.ipa \
              build/artifacts/Stuxnet.DSYMs.zip \
              --title "$TITLE" \
              --notes "Unsigned Stuxnet iOS build. Installation on a physical device, TestFlight, or App Store distribution requires valid Apple signing."
          fi
